version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: netpulse-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-netpulse}
      POSTGRES_USER: ${POSTGRES_USER:-netpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netpulse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-netpulse} -d ${POSTGRES_DB:-netpulse}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: netpulse-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: netpulse-api
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-netpulse}:${POSTGRES_PASSWORD:-netpulse}@postgres:5432/${POSTGRES_DB:-netpulse}?schema=public
      REDIS_URL: redis://redis:6379
      API_PORT: ${API_PORT:-8080}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"

  worker-bangalore:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: netpulse-worker-bangalore
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-netpulse}:${POSTGRES_PASSWORD:-netpulse}@postgres:5432/${POSTGRES_DB:-netpulse}?schema=public
      REDIS_URL: redis://redis:6379
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-5000}
      WORKER_REGION: bangalore
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-singapore:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: netpulse-worker-singapore
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-netpulse}:${POSTGRES_PASSWORD:-netpulse}@postgres:5432/${POSTGRES_DB:-netpulse}?schema=public
      REDIS_URL: redis://redis:6379
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-5000}
      WORKER_REGION: singapore
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-frankfurt:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: netpulse-worker-frankfurt
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-netpulse}:${POSTGRES_PASSWORD:-netpulse}@postgres:5432/${POSTGRES_DB:-netpulse}?schema=public
      REDIS_URL: redis://redis:6379
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-5000}
      WORKER_REGION: frankfurt
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: netpulse-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:${API_PORT:-8080}/api
      VITE_WS_URL: ws://localhost:${API_PORT:-8080}/ws
    depends_on:
      - api
    ports:
      - "5173:5173"

volumes:
  pg_data:
  redis_data:
